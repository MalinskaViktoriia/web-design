<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея Малінської Вікторії Володимирівни</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Галерея Малінської Вікторії</h1>
<p><a href="index.html" class="back-link">Назад на головну</a></p>

<h2 class="main-title">Мої зображення</h2>

<div class="gallery-container">

    <div class="gallery-item item-1">
        <h3 class="title-root">Зображення у цій папці</h3>
        <img src="640x480.svg" alt="Зображення з папки проекту" width="640" height="480">
    </div>

    <div class="gallery-item item-2">
        <h3 class="title-folder">Зображення у папці images</h3>
        <img src="images/640x480.svg" alt="Зображення з підпапки images" width="640" height="480">
    </div>

    <div class="gallery-item item-3">
        <h3 class="title-online">Зображення онлайн</h3>
        <a href="https://placehold.co/1280x1024" target="_blank">
            <img src="https://placehold.co/1280x1024" alt="Зображення з сайту" width="1280" height="1024">
        </a>
    </div>

</div>

</body>
</html>
